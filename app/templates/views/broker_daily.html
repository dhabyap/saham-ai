<template v-if="currentView === 'brokerdaily'">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn" :class="{ active: bdDailyTab === 'overview' }" @click="bdDailyTab='overview'">Ringkasan</button>
    <button class="tab-btn" :class="{ active: bdDailyTab === 'ranking' }" @click="bdDailyTab='ranking';loadBdDailyRanking()">🏆 Ranking</button>
    <button class="tab-btn" :class="{ active: bdDailyTab === 'detail' }" @click="bdDailyTab='detail'">📋 Detail Tanggal</button>
    <button class="tab-btn" :class="{ active: bdDailyTab === 'trend' }" @click="bdDailyTab='trend';loadBdDailyTrend()">📈 Trend Broker</button>
  </div>

  <!-- Loading -->
  <div v-if="bdDailyLoading" class="loading-box"><div class="spinner"></div><span>Memuat data broker...</span></div>

  <!-- Error -->
  <div v-if="bdDailyError" class="error-box" style="color:var(--danger);padding:16px">{{ bdDailyError }}</div>

  <!-- ═══ OVERVIEW TAB ═══ -->
  <div v-if="bdDailyTab==='overview' && bdDailySummary && !bdDailyLoading">
    <div class="stat-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">
      <div class="stat-card">
        <div class="stat-label">Periode</div>
        <div class="stat-value-sm">{{ bdDailySummary.date_from }} → {{ bdDailySummary.date_to }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hari Trading</div>
        <div class="stat-value">{{ bdDailySummary.trading_days }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Nilai</div>
        <div class="stat-value-sm">Rp {{ bdFmt(bdDailySummary.total_value) }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rata-rata/Hari</div>
        <div class="stat-value-sm">Rp {{ bdFmt(bdDailySummary.avg_daily_value) }}</div>
      </div>
    </div>

    <!-- Top Broker -->
    <div v-if="bdDailySummary.top_broker" class="stat-card" style="margin-bottom:16px;border-left:3px solid var(--accent)">
      <div class="stat-label">🏆 Broker Teraktif (Total Value)</div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-top:4px">
        <span style="font-size:20px;font-weight:700;color:var(--accent)">{{ bdDailySummary.top_broker.code }}</span>
        <span style="color:var(--text-secondary);font-size:13px">{{ bdDailySummary.top_broker.name }}</span>
        <span style="font-weight:600">Rp {{ bdFmt(bdDailySummary.top_broker.total_value) }}</span>
      </div>
    </div>

    <!-- Dates list -->
    <h3 style="margin:16px 0 8px;font-size:15px;color:var(--text-secondary)">📅 Tanggal Tersedia</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <button v-for="d in bdDailyDates" :key="d.date"
              class="btn btn-sm" :class="bdSelectedDate===d.date ? 'btn-accent' : 'btn-outline'"
              @click="bdSelectedDate=d.date;bdDailyTab='detail';loadBdDailyDetail(d.date)">
        {{ d.date.slice(6) }}/{{ d.date.slice(4,6) }} <small>({{ d.brokers }})</small>
      </button>
    </div>
  </div>

  <!-- ═══ RANKING TAB ═══ -->
  <div v-if="bdDailyTab==='ranking'">


    <div v-if="bdDailyRankLoading" class="loading-box"><div class="spinner"></div></div>
    <div v-if="bdDailyRank && bdDailyRank.length">
      <div style="overflow-x:auto">
        <table class="table" style="width:100%;font-size:13px">
          <thead>
            <tr>
              <th style="width:40px">#</th>
              <th>Kode</th>
              <th>Nama Broker</th>
              <th style="text-align:right">Total Value</th>
              <th style="text-align:right">Total Volume</th>
              <th style="text-align:right">Freq</th>
              <th style="text-align:right">Hari</th>
              <th style="text-align:right">Avg/Day</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(b,i) in bdDailyRank" :key="b.broker_code"
                style="cursor:pointer" @click="bdTrendQuery=b.broker_code;bdDailyTab='trend';loadBdDailyTrend()">
              <td>{{ i+1 }}</td>
              <td style="font-weight:700;color:var(--accent)">{{ b.broker_code }}</td>
              <td style="color:var(--text-secondary)">{{ b.broker_name }}</td>
              <td style="text-align:right;font-weight:600">Rp {{ bdFmt(b.total_value) }}</td>
              <td style="text-align:right">{{ Number(b.total_volume).toLocaleString() }}</td>
              <td style="text-align:right">{{ Number(b.total_freq).toLocaleString() }}</td>
              <td style="text-align:right">{{ b.trading_days }}</td>
              <td style="text-align:right;color:var(--text-secondary)">Rp {{ bdFmt(Math.round(b.total_value / b.trading_days)) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div v-if="bdDailyRank && !bdDailyRank.length && !bdDailyRankLoading" class="empty-state">
      Tidak ada data untuk periode ini
    </div>
  </div>

  <!-- ═══ DETAIL TAB ═══ -->
  <div v-if="bdDailyTab==='detail'">


    <div v-if="bdDailyDetailLoading" class="loading-box"><div class="spinner"></div></div>
    <div v-if="bdDailyDetail && bdDailyDetail.length">
      <div style="margin-bottom:8px;color:var(--text-secondary);font-size:13px">
        {{ bdSelectedDate }} — {{ bdDailyDetail.length }} broker — Total: Rp {{ bdFmt(bdDailyDetail.reduce((s,b)=>s+b.value,0)) }}
      </div>
      <div style="overflow-x:auto">
        <table class="table" style="width:100%;font-size:13px">
          <thead>
            <tr>
              <th style="width:40px">#</th>
              <th>Kode</th>
              <th>Nama Broker</th>
              <th style="text-align:right">Value</th>
              <th style="text-align:right">Volume</th>
              <th style="text-align:right">Freq</th>
              <th style="width:120px">% Total</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(b,i) in bdDailyDetail" :key="b.broker_code">
              <td>{{ i+1 }}</td>
              <td style="font-weight:700;color:var(--accent)">{{ b.broker_code }}</td>
              <td style="color:var(--text-secondary)">{{ b.broker_name }}</td>
              <td style="text-align:right;font-weight:600">Rp {{ bdFmt(b.value) }}</td>
              <td style="text-align:right">{{ Number(b.volume).toLocaleString() }}</td>
              <td style="text-align:right">{{ Number(b.frequency).toLocaleString() }}</td>
              <td>
                <div style="background:var(--bg-secondary);border-radius:4px;height:6px;overflow:hidden">
                  <div :style="{ width: Math.min(100, b.value / bdDailyDetail[0].value * 100) + '%', background:'var(--accent)', height:'100%', borderRadius:'4px' }"></div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ═══ TREND TAB ═══ -->
  <div v-if="bdDailyTab==='trend'">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
      <label style="color:var(--text-secondary);font-size:13px">Broker:</label>
      <select v-model="bdTrendQuery" class="bd-search-input" style="width:120px;padding:6px 10px" @change="loadBdDailyTrend()">
        <option v-for="d in bdDailyRank" :key="d.broker_code" :value="d.broker_code">{{ d.broker_code }}</option>
      </select>
    </div>

    <div v-if="bdDailyTrendLoading" class="loading-box"><div class="spinner"></div></div>
    <div v-if="bdDailyTrend && bdDailyTrend.length">
      <div style="margin-bottom:12px;font-weight:600;color:var(--accent)">
        {{ bdTrendQuery }} — {{ bdDailyTrend[0].broker_name || '' }}
        <small style="color:var(--text-secondary);font-weight:400">({{ bdDailyTrend.length }} hari)</small>
      </div>

      <!-- Chart canvas -->
      <div style="background:var(--bg-card);border-radius:12px;padding:16px;margin-bottom:16px">
        <canvas id="bdDailyTrendChart" height="200"></canvas>
      </div>

      <!-- Data table -->
      <div style="overflow-x:auto">
        <table class="table" style="width:100%;font-size:13px">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th style="text-align:right">Value</th>
              <th style="text-align:right">Volume</th>
              <th style="text-align:right">Freq</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="t in bdDailyTrend" :key="t.date">
              <td>{{ t.date }}</td>
              <td style="text-align:right;font-weight:600">Rp {{ bdFmt(t.value) }}</td>
              <td style="text-align:right">{{ Number(t.volume).toLocaleString() }}</td>
              <td style="text-align:right">{{ Number(t.frequency).toLocaleString() }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div v-if="bdDailyTrend && !bdDailyTrend.length && !bdDailyTrendLoading" class="empty-state">
      Tidak ada data untuk broker ini
    </div>
  </div>

</template>
