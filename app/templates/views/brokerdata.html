<template v-if="currentView === 'brokerdata'">
  
  <div class="tabs">
    <button class="tab-btn" :class="{ active: currentTab === 'overview' }" @click="currentTab = 'overview'">Ringkasan</button>
    <button class="tab-btn" :class="{ active: currentTab === 'netflow' }" @click="currentTab = 'netflow'">Net Flow</button>
    <button class="tab-btn" :class="{ active: currentTab === 'crossing' }" @click="currentTab = 'crossing'">Crossing</button>
    <button class="tab-btn" :class="{ active: currentTab === 'crossing_sum' }" @click="currentTab = 'crossing_sum'">Crossing Sum</button>
    <button class="tab-btn" :class="{ active: currentTab === 'airec' }" @click="currentTab = 'airec'">
      🤖 AI Rekomendasi
      <span v-if="bdRecommendation && bdRecommendation.recommendation" class="tab-badge" :style="{ background: bdRecommendation.recommendation === 'BUY' ? 'var(--success)' : bdRecommendation.recommendation === 'SELL' ? 'var(--danger)' : 'var(--warning)' }">{{ bdRecommendation.recommendation }}</span>
    </button>
    <button class="tab-btn" :class="{ active: currentTab === 'upload' }" @click="currentTab = 'upload'">📤 Upload</button>
  </div>

  <!-- Search bar -->
  <div class="overview-search bd-search-bar">
    <input type="text" v-model="bdStockQuery" placeholder="Cari kode saham..."
           @input="onBdSearchInput" @keydown.down.prevent="bdHighlight++" @keydown.up.prevent="bdHighlight--"
           @keydown.enter="bdSelectHighlighted" @focus="onBdSearchInput"
           @blur="bdHideSuggestions($event)" autocomplete="off"
           class="bd-search-input">
    <button class="btn btn-sm btn-accent" @click="searchBdStock()"
            :disabled="bdLoading">
      <span v-if="!bdLoading">Cari</span><span v-else>⏳</span>
    </button>
    <!-- Active stock as inline part of search bar -->
    <div v-if="bdCurrentStock" class="bd-active-chip">
      {{ bdCurrentStock.stock_code }}
      <small style="opacity:0.7">({{ bdCurrentStock.entries }} entry)</small>
      <span @click="bdCurrentStock=null;bdData=null;bdStockQuery=''" class="bd-chip-close">&times;</span>
    </div>
    <!-- Suggestions dropdown -->
    <div class="bd-suggestions" v-if="bdShowSuggestions && bdFiltered.length"
         style="position:absolute;top:calc(100% + 12px);left:0;width:100%;z-index:9999;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:8px 0;box-shadow:0 8px 24px rgba(0,0,0,0.3);max-height:250px;overflow-y:auto;">
      <div v-for="(s, i) in bdFiltered" :key="s.stock_code"
           class="bd-suggestion-item" :class="{ active: bdHighlight === i }"
           @mousedown.prevent="selectBdStock(s)" @mouseenter="bdHighlight = i">
        <span class="s-code" style="font-weight:700;color:var(--accent);min-width:65px">{{ s.stock_code }}</span>
        <span class="s-meta" style="flex:1;color:var(--text-secondary);font-size:12px">{{ s.latest_from || '?' }} → {{ s.latest_to || '?' }}</span>
        <span class="badge">{{ s.entries }} entry</span>
      </div>
    </div>
  </div>

  <!-- Suggest Upload Section (shown when no stock selected) -->
  <div v-if="!bdData && !bdLoading && !bdError">
    <!-- Loading suggest -->
    <div v-if="bdSuggestLoading" class="loading-box" style="margin-bottom:12px">
      <div class="spinner"></div><span>Mencari saham menarik...</span>
    </div>

    <!-- Suggest cards -->
    <div v-else-if="bdSuggestUpload && bdSuggestUpload.length" style="margin-bottom:16px">
      <div class="bd-suggest-header">
        <span style="font-size:18px">💡</span>
        <div>
          <div class="bd-suggest-title">Upload Data Broker untuk Saham Ini</div>
          <div class="bd-suggest-sub">
            Saham berikut menarik — masukkan data broker untuk analisis lebih lanjut
          </div>
        </div>
      </div>
      <div class="bd-suggest-grid">
        <div v-for="s in bdSuggestUpload" :key="s.stock_code"
             @click="selectBdStock({stock_code:s.stock_code,entries:0})"
             class="bd-suggest-card">
          <div class="bd-suggest-top">
            <span class="bd-suggest-code">{{ s.stock_code }}</span>
            <span class="bd-suggest-pct">{{ s.change_pct >= 0 ? '+' : '' }}{{ s.change_pct }}%</span>
          </div>
          <div v-if="s.name" class="bd-suggest-name">{{ s.name }}</div>
          <div class="bd-suggest-reason">
            {{ s.reason }}
          </div>
          <div class="bd-suggest-tags">
            <span class="bd-suggest-tag bd-suggest-tag-vol" v-if="s.volume_ratio >= 1.5">Volume {{ s.volume_ratio }}x</span>
            <span class="bd-suggest-tag bd-suggest-tag-price">Rp{{ (s.price || 0).toLocaleString('id') }}</span>
          </div>
        </div>
      </div>
      <div class="bd-suggest-footer">
        Klik saham di atas untuk melihat data broker yang sudah ada, atau
      </div>
    </div>

    <!-- Stock picker with letter filter -->
    <div v-if="bdAvailable.filter(s => s.entries > 0).length" style="margin-top:8px">
      <div class="bd-picker-header">
        <div class="bd-picker-count">
          Pilih kode saham <span style="opacity:0.6">({{ bdGroupedStocks.length }} saham{{ bdLetterFilter ? ' huruf '+bdLetterFilter : '' }}{{ bdStockQuery ? ' — "'+bdStockQuery+'"' : '' }})</span>
        </div>
        <button v-if="bdLetterFilter || bdStockQuery" @click="bdLetterFilter='';bdStockQuery=''" class="bd-reset-btn">
          ✕ Reset filter
        </button>
      </div>
      <!-- Letter filter buttons -->
      <div class="bd-letter-bar">
        <button v-for="l in bdLetters" :key="l" class="bd-letter-btn" :class="{active: bdLetterFilter===l}" @click="bdLetterFilter=bdLetterFilter===l?'':l">{{ l }}</button>
      </div>
      <!-- Stock grid -->
      <div class="bd-stock-grid">
        <div v-for="s in bdGroupedStocks" :key="s.stock_code"
             @click="selectBdStock(s)"
             :title="s.stock_code+' — '+s.latest_from+' → '+s.latest_to+' ('+s.entries+' entry)'"
             class="bd-stock-tag">
          <span class="bd-tag-code">{{ s.stock_code }}</span>
          <span class="bd-tag-count">{{ s.entries }}</span>
        </div>
      </div>
      <div v-if="!bdGroupedStocks.length && bdLetterFilter" class="bd-empty-msg">
        Tidak ada data broker untuk huruf {{ bdLetterFilter }}
      </div>
    </div>
    <div v-else-if="!bdLoading" class="bd-empty-msg">
      Belum ada data broker — cari kode saham di atas untuk upload
    </div>
  </div>

  <!-- Overview Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'overview' }">
    <template v-if="bdLoading">
      <div class="loading-box"><div class="spinner"></div><span>Memuat data broker...</span></div>
    </template>
    <template v-else-if="bdError">
      <div class="error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">{{ bdError }}</div>
        <div class="error-hint">Coba kode saham lain atau cek koneksi</div>
      </div>
    </template>
    <template v-else-if="bdData">
      <div class="stat-grid">
        <div class="stat-card mint"><div class="stat-label">Periode</div><div class="stat-value-sm">{{ bdData.period_from || '-' }} → {{ bdData.period_to || '-' }}</div></div>
        <div class="stat-card green"><div class="stat-label">Total Buy</div><div class="stat-value-sm">Rp{{ bdFmt(bdData.total_buy_value) }}</div></div>
        <div class="stat-card red"><div class="stat-label">Total Sell</div><div class="stat-value-sm">Rp{{ bdFmt(bdData.total_sell_value) }}</div></div>
        <div class="stat-card"><div class="stat-label">Buyer Brokers</div><div class="stat-value-sm">{{ bdData.buyer_count }}</div></div>
        <div class="stat-card"><div class="stat-label">Seller Brokers</div><div class="stat-value-sm">{{ bdData.seller_count }}</div></div>
      </div>
      <div class="info-chip" v-if="bdData.is_gross"><span class="chip-icon">📊</span> GROSS: buy + sell dilaporkan terpisah</div>

      <!-- Net Flow Summary -->
      <div class="bd-ns-row" v-if="bdData.total_buy_value && bdData.total_sell_value">
        <div class="bd-ns-card" :class="Number(bdData.total_buy_value.replace(/,/g,'')) >= Number(bdData.total_sell_value.replace(/,/g,'')) ? 'positive' : 'negative'">
          <div class="bd-ns-label">Net Flow</div>
          <div class="bd-ns-val">Rp{{ bdFmt(String(Math.abs(Number(bdData.total_buy_value.replace(/,/g,'')) - Number(bdData.total_sell_value.replace(/,/g,''))))) }}</div>
          <div class="bd-ns-tag" v-if="Number(bdData.total_buy_value.replace(/,/g,'')) >= Number(bdData.total_sell_value.replace(/,/g,''))">🟢 NET BELI</div>
          <div class="bd-ns-tag" v-else>🔴 NET JUAL</div>
        </div>
        <div class="bd-ns-card">
          <div class="bd-ns-label">Buy/Sell Ratio</div>
          <div class="bd-ns-bar-wrap">
            <div class="bd-ns-bar">
              <div class="bd-ns-bar-buy" :style="{ width: (Number(bdData.total_buy_value.replace(/,/g,'')) / (Number(bdData.total_buy_value.replace(/,/g,'')) + Number(bdData.total_sell_value.replace(/,/g,''))) * 100) + '%' }"></div>
              <div class="bd-ns-bar-sell" :style="{ width: (Number(bdData.total_sell_value.replace(/,/g,'')) / (Number(bdData.total_buy_value.replace(/,/g,'')) + Number(bdData.total_sell_value.replace(/,/g,''))) * 100) + '%' }"></div>
            </div>
            <div class="bd-ns-ratio-labels">
              <span class="bd-ns-ratio-buy">{{ ((Number(bdData.total_buy_value.replace(/,/g,'')) / (Number(bdData.total_buy_value.replace(/,/g,'')) + Number(bdData.total_sell_value.replace(/,/g,''))) * 100)).toFixed(1) }}% Buy</span>
              <span class="bd-ns-ratio-sell">{{ ((Number(bdData.total_sell_value.replace(/,/g,'')) / (Number(bdData.total_buy_value.replace(/,/g,'')) + Number(bdData.total_sell_value.replace(/,/g,''))) * 100)).toFixed(1) }}% Sell</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Top Buyers / Sellers -->
      <div class="bd-ns-row" v-if="bdData.buyers && bdData.buyers.length">
        <div class="bd-ns-card">
          <div class="bd-ns-label">🟢 Top 5 Buyers</div>
          <div class="bd-broker-list">
            <div v-for="(b, i) in bdData.buyers.slice(0, 5)" :key="b.broker_code" class="bd-broker-row buyer">
              <span class="bd-broker-rank">{{ i+1 }}</span>
              <span class="bd-broker-code">{{ b.broker_code }}</span>
              <span class="bd-broker-val">Rp{{ bdFmt(String(b.value)) }}</span>
              <span class="bd-broker-lots">{{ Number(b.lots).toLocaleString() }} lot</span>
            </div>
          </div>
        </div>
        <div class="bd-ns-card">
          <div class="bd-ns-label">🔴 Top 5 Sellers</div>
          <div class="bd-broker-list">
            <div v-for="(b, i) in bdData.sellers.slice(0, 5)" :key="b.broker_code" class="bd-broker-row seller">
              <span class="bd-broker-rank">{{ i+1 }}</span>
              <span class="bd-broker-code">{{ b.broker_code }}</span>
              <span class="bd-broker-val">Rp{{ bdFmt(String(b.value)) }}</span>
              <span class="bd-broker-lots">{{ Number(b.lots).toLocaleString() }} lot</span>
            </div>
          </div>
        </div>
      </div>

      <div class="insight-grid">
        <div class="insight-card" v-if="bdData.top_two_way">
          <div class="insight-header"><span class="insight-icon">🔄</span><span>Two-Way Broker</span></div>
          <div class="insight-body">
            <div class="two-way-bar">
              <div class="bar-labels"><span>Buy</span><span>Sell</span></div>
              <div class="bar-track"><div class="bar-fill buy-fill" :style="{ width: bdData.top_two_way.two_way_percentage+'%' }"></div></div>
              <div class="bar-pct">{{ bdData.top_two_way.two_way_percentage.toFixed(1) }}% 2-way</div>
            </div>
            <div class="insight-detail"><span class="detail-label">Tertinggi:</span><span class="detail-val">{{ bdData.top_two_way.broker_code }}</span><span class="detail-sub">B={{ bdData.top_two_way.buy_lots.toLocaleString() }} S={{ bdData.top_two_way.sell_lots.toLocaleString() }} Vol={{ bdData.top_two_way.total_volume.toLocaleString() }}</span></div>
            <div class="insight-detail" v-if="bdData.most_one_way"><span class="detail-label">1-way:</span><span class="detail-val">{{ bdData.most_one_way.broker_code }}</span><span class="detail-sub">({{ bdData.most_one_way.two_way_percentage.toFixed(1) }}% 2-way)</span></div>
          </div>
        </div>
        <div class="insight-card" v-if="bdData.crossing_count">
          <div class="insight-header"><span class="insight-icon">✂️</span><span>Potential Crossings</span></div>
          <div class="insight-body">
            <div class="crossing-stat">
              <div class="crossing-big">{{ bdData.crossing_count }}</div>
              <div class="crossing-label">pairs detected</div>
            </div>
            <div class="crossing-metrics">
              <div class="metric"><div class="metric-label">Avg Spread</div><div class="metric-val">Rp{{ (bdData.avg_spread || 0).toLocaleString('id') }}</div></div>
              <div class="metric" v-if="bdData.widest_crossing">
                <div class="metric-label">Widest</div>
                <div class="metric-val bd-widest-val">{{ bdData.widest_crossing.buyer_broker }}→{{ bdData.widest_crossing.seller_broker }}</div>
                <div class="metric-sub">Rp{{ Math.round(bdData.widest_crossing.spread).toLocaleString('id') }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Net Flow Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'netflow' }">
    <template v-if="bdError">
      <div class="error-card bd-section-gap">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">{{ bdError }}</div>
        <div class="error-hint">Coba kode saham lain atau cek koneksi</div>
      </div>
    </template>
    <template v-else-if="bdData && bdData.net_flow">
      <!-- Summary: Total Buy vs Sell -->
      <div class="bd-nf-summary">
        <div class="bd-nf-summary-side">
          <div class="bd-nf-summary-label">🟢 Total BUY</div>
          <div class="bd-nf-summary-val buy">Rp{{ fmtRupiah(bdData.net_flow.filter(b => b.net >= 0).reduce((s,b) => s + b.net, 0)) }}</div>
        </div>
        <div class="bd-nf-summary-vs">VS</div>
        <div class="bd-nf-summary-side">
          <div class="bd-nf-summary-label">🔴 Total SELL</div>
          <div class="bd-nf-summary-val sell">Rp{{ fmtRupiah(Math.abs(bdData.net_flow.filter(b => b.net < 0).reduce((s,b) => s + b.net, 0))) }}</div>
        </div>
      </div>
      <!-- Split: BUY left, SELL right -->
      <div class="bd-nf-split">
        <!-- BUY Column -->
        <div class="bd-nf-col">
          <div class="bd-nf-col-header buy">
            🟢 Buyer Brokers
            <span class="bd-nf-col-count">{{ bdData.net_flow.filter(b => b.net >= 0).length }} broker</span>
          </div>
          <div v-for="b in bdData.net_flow.filter(b => b.net >= 0).sort((a,b) => b.net - a.net)" :key="b.broker_code" class="bd-nf-card">
            <span class="bd-nf-code">{{ b.broker_code }}</span>
            <div class="bd-nf-vals">
              <span class="bd-nf-net buy">+Rp{{ b.net.toLocaleString('id') }}</span>
              <span class="bd-nf-detail">B Rp{{ b.buy_value.toLocaleString('id') }} · S Rp{{ b.sell_value.toLocaleString('id') }}</span>
            </div>
          </div>
          <div v-if="!bdData.net_flow.filter(b => b.net >= 0).length" class="bd-nf-empty">Tidak ada buyer broker</div>
        </div>
        <!-- SELL Column -->
        <div class="bd-nf-col">
          <div class="bd-nf-col-header sell">
            🔴 Seller Brokers
            <span class="bd-nf-col-count">{{ bdData.net_flow.filter(b => b.net < 0).length }} broker</span>
          </div>
          <div v-for="b in bdData.net_flow.filter(b => b.net < 0).sort((a,b) => a.net - b.net)" :key="b.broker_code" class="bd-nf-card">
            <span class="bd-nf-code">{{ b.broker_code }}</span>
            <div class="bd-nf-vals">
              <span class="bd-nf-net sell">{{ b.net.toLocaleString('id') }}</span>
              <span class="bd-nf-detail">B Rp{{ b.buy_value.toLocaleString('id') }} · S Rp{{ b.sell_value.toLocaleString('id') }}</span>
            </div>
          </div>
          <div v-if="!bdData.net_flow.filter(b => b.net < 0).length" class="bd-nf-empty">Tidak ada seller broker</div>
        </div>
      </div>
    </template>
    <template v-else-if="!bdData"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">{{ bdCurrentStock ? 'Belum ada data net flow untuk ' + bdCurrentStock.stock_code : 'Cari saham dulu' }}</div></div></template>
    <template v-else><div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Tidak ada data net flow</div></div></template>
  </div>

  <!-- Crossing Summary Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'crossing_sum' }">
    <div v-if="csLoading" class="loading-box"><div class="spinner"></div><span>Loading summary...</span></div>
    <div v-else-if="csError" class="error-card">{{ csError }}</div>
    <div v-else-if="csData">
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit, minmax(120px, 1fr))">
        <div class="stat-card">
          <div class="stat-label">Total Crossing</div>
          <div class="stat-value">{{ csData.total_crossing }}</div>
        </div>
      </div>
      <div class="bd-chart-wrap">
        <canvas id="crossingSummaryChart"></canvas>
      </div>
      <div class="section">
        <div class="section-title">Top 5 Broker Teraktif</div>
        <div v-for="b in csData.top_brokers" :key="b[0]" class="bd-toplist-row">
          <strong>{{ b[0] }}</strong> <span>{{ b[1] }} crossing</span>
        </div>
      </div>
    </div>
    <div v-else class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">Pilih saham untuk melihat rangkuman crossing</div>
    </div>
  </div>
  <!-- Crossing Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'crossing' }">
    <template v-if="bdError">
      <div class="error-card" style="margin-top:12px">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">{{ bdError }}</div>
        <div class="error-hint">Coba kode saham lain atau cek koneksi</div>
      </div>
    </template>
    <template v-else-if="bdData && bdData.crossings && bdData.crossings.length">
      <div class="section"><div class="section-title">✂️ Potential Crossings ({{ bdData.crossings.length }})</div>
      <div class="table-wrap bd-table-wrap">
        <table class="table-compact bd-table-cross">
          <thead>
            <tr><th>Buyer</th><th>Seller</th><th>Lots</th><th>Buy Avg</th><th>Sell Avg</th><th>Spread</th></tr>
          </thead>
          <tbody>
            <tr v-for="c in bdData.crossings" :key="c.buyer_broker + c.seller_broker">
              <td class="green">{{ c.buyer_broker }}</td>
              <td class="red">{{ c.seller_broker }}</td>
              <td>{{ c.potential_lots.toLocaleString('id') }}</td>
              <td>Rp{{ Math.round(c.buyer_avg_price).toLocaleString('id') }}</td>
              <td>Rp{{ Math.round(c.seller_avg_price).toLocaleString('id') }}</td>
              <td class="bold" :style="{ color: c.spread >= 0 ? 'var(--success)' : 'var(--danger)' }">Rp{{ Math.round(c.spread).toLocaleString('id') }}</td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </template>
    <template v-else-if="!bdData"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">{{ bdCurrentStock ? 'Belum ada data crossing untuk ' + bdCurrentStock.stock_code : 'Cari saham dulu' }}</div></div></template>
    <template v-else><div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Tidak ada crossing data</div></div></template>
  </div>
  </div>

  <!-- AI Rekomendasi Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'airec' }">
    <template v-if="bdRecLoading">
      <div class="loading-box"><div class="spinner"></div><span>Menganalisa data broker...</span></div>
    </template>
    <template v-else-if="!bdData && !bdLoading">
      <div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">Cari saham dulu untuk lihat rekomendasi</div></div>
    </template>
    <template v-else-if="bdRecommendation">
      <!-- Hero: Recommendation + Confidence -->
      <div class="bd-ai-rec-hero" v-if="bdRecommendation.recommendation">
        <div class="bd-ai-rec-label">Rekomendasi Berbasis Broker</div>
        <div class="bd-ai-rec-action" :class="bdRecommendation.recommendation.toLowerCase()">{{ bdRecommendation.recommendation }}</div>
        <div class="bd-ai-rec-reason">{{ bdRecommendation.reason }}</div>
        <div class="bd-ai-conf-bar">
          <div class="bd-ai-conf-fill" :class="bdRecommendation.recommendation.toLowerCase()" :style="{ width: bdRecommendation.confidence + '%' }"></div>
        </div>
        <div class="bd-ai-conf-text">Keyakinan {{ bdRecommendation.confidence }}%</div>
      </div>

      <!-- Category Breakdown: 3 columns -->
      <div class="bd-ai-cats" v-if="bdRecommendation && bdRecommendation.categories">
        <template v-for="(cat, catKey) in bdRecommendation.categories" :key="catKey">
          <div class="bd-ai-cat" v-if="cat && cat.broker_count > 0">
            <div class="bd-ai-cat-head">
              <span class="bd-ai-cat-icon">{{ catKey === 'smart_money' ? '🌍' : catKey === 'institutional' ? '🏦' : '👤' }}</span>
              <span class="bd-ai-cat-name">{{ catKey === 'smart_money' ? 'Smart Money' : catKey === 'institutional' ? 'Institusi Lokal' : 'Retail' }}</span>
              <span class="bd-ai-cat-net" :class="cat.net_value >= 0 ? 'buy' : 'sell'">{{ cat.net_value >= 0 ? '+' : '' }}Rp{{ fmtRupiah(cat.net_value) }}</span>
            </div>
            <!-- Buy/Sell bar -->
            <div class="bd-ai-cat-bar">
              <div class="bd-ai-cat-bar-seg buy" :style="{ width: cat.total_buy_value + cat.total_sell_value > 0 ? (cat.total_buy_value/(cat.total_buy_value+cat.total_sell_value)*100)+'%' : '50%' }">
                {{ cat.total_buy_value > 0 ? 'BUY Rp'+fmtRupiah(cat.total_buy_value) : '' }}
              </div>
              <div class="bd-ai-cat-bar-seg sell" :style="{ width: cat.total_buy_value + cat.total_sell_value > 0 ? (cat.total_sell_value/(cat.total_buy_value+cat.total_sell_value)*100)+'%' : '50%' }">
                {{ cat.total_sell_value > 0 ? 'SELL Rp'+fmtRupiah(cat.total_sell_value) : '' }}
              </div>
            </div>
            <!-- Meta -->
            <div class="bd-ai-cat-meta">
              <span>{{ cat.broker_count }} broker</span>
              <span class="bd-ai-cat-net-row" v-if="cat.net_value > 0">🔥 Net Beli <strong :style="{color:'var(--success)'}">Rp{{ fmtRupiah(cat.net_value) }}</strong></span>
              <span class="bd-ai-cat-net-row" v-else-if="cat.net_value < 0">🔻 Net Jual <strong :style="{color:'var(--danger)'}">Rp{{ fmtRupiah(cat.net_value) }}</strong></span>
              <span class="bd-ai-cat-net-row" v-else>⚖️ Imbang</span>
            </div>
            <!-- Broker chips (truncated) -->
            <div class="bd-ai-cat-brokers">
              <template v-if="bdExpandedCats[catKey]">
                <span class="bd-ai-broker-chip" v-for="br in cat.brokers" :key="br">{{ br }}</span>
              </template>
              <template v-else>
                <span class="bd-ai-broker-chip" v-for="br in cat.brokers.slice(0,12)" :key="br">{{ br }}</span>
                <button v-if="cat.brokers.length > 12" class="bd-ai-broker-toggle" @click="bdExpandedCats[catKey]=true">+{{ cat.brokers.length - 12 }} lainnya</button>
              </template>
              <button v-if="bdExpandedCats[catKey] && cat.brokers.length > 12" class="bd-ai-broker-toggle" @click="bdExpandedCats[catKey]=false">tutup</button>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Signals -->
      <div v-if="bdRecommendation.signals.length">
        <div class="section-title" style="margin-bottom:10px">🚦 Sinyal</div>
        <div class="bd-ai-signals">
          <div v-for="s in bdRecommendation.signals" :key="s.type" class="bd-ai-signal" :class="s.sentiment">
            <span class="bd-ai-signal-icon">{{ s.label }}</span>
            <div class="bd-ai-signal-body">
              <div class="bd-ai-signal-title">{{ s.type.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) }}</div>
              <div class="bd-ai-signal-msg">{{ s.message }}</div>
            </div>
            <span class="bd-ai-signal-badge" :class="s.sentiment">{{ s.sentiment }}</span>
          </div>
        </div>
      </div>
    </template>
    <template v-else>
      <div class="empty-state"><div class="empty-icon">🤖</div><div class="empty-text">Memuat rekomendasi...</div></div>
    </template>
  </div>

  <!-- Upload Tab -->
  <div class="tab-pane" :class="{ active: currentTab === 'upload' }">
    <div class="bd-upload-wrap">
      <div class="bd-upload-title">📤 Upload Data Broker</div>
      <div class="bd-upload-hint">Paste data JSON dari bot Telegram langsung ke sini</div>
      <textarea id="brokerUploadPaste" rows="10" class="bd-upload-textarea" placeholder='Contoh:&#10;{"ticker": "TOWR", "broker_summary": {"buyers": [{"broker_code":"AK","lots":100,"value":5000000,"avg_price":62500}], "sellers": [{"broker_code":"CC","lots":50,"value":3100000,"avg_price":62000}]}}'></textarea>
      <div class="bd-upload-actions">
        <button @click="doUploadBrokerPaste" class="btn btn-primary bd-upload-btn">⬆ Upload ke MySQL</button>
        <button @click="clearUploadPaste" class="bd-upload-clear">🗑 Hapus</button>
      </div>
      <div id="uploadStatus" class="bd-upload-status">{{ uploadStatusText }}</div>
    </div>
  </div>
</template>
